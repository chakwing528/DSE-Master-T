<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSE 修練所</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DSE修練所">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <!-- 🚨 系統診斷工具：攔截並顯示任何遺漏括號或載入失敗的錯誤 -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            alert("🚨 系統偵測到程式碼有誤：\n" + msg + "\n\n這通常是因為複製 app.js 時遺漏了最後一行的括號，或是檔案上傳失敗！");
            return false;
        };
    </script>

    <style>
        .math-scroll { overflow-x: auto; overflow-y: hidden; }
        .math-scroll::-webkit-scrollbar { height: 6px; }
        .math-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
        /* 防止手寫畫布上的觸控滾動行為 */
        #draw-canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <main class="max-w-4xl mx-auto p-3 sm:p-5 mt-4" id="main-wrapper">
        
        <!-- ========================================== -->
        <!-- 畫面 1：選擇課題 (首頁) -->
        <!-- ========================================== -->
        <div id="topicScreen" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-8 text-center max-w-4xl mx-auto">
            
            <div class="flex justify-center items-center gap-3 mb-6">
                <div class="bg-indigo-100 text-indigo-600 p-3 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">DSE 修練所 <span class="text-base sm:text-lg text-indigo-600 align-top ml-1">(Beta)</span></h1>
            </div>

            <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2 mt-4">請選擇練習課題</h2>
            <p class="text-slate-500 mb-8 font-medium">每天進步一點點，時間會看見</p>
            
            <!-- 題數設定膠囊 -->
            <div class="mb-10 max-w-lg mx-auto bg-slate-50 p-2 rounded-full border border-slate-200 flex items-center justify-center gap-1 sm:gap-2 shadow-sm">
                <span class="text-slate-600 font-bold text-sm sm:text-base ml-4 mr-2 hidden sm:inline-block">每回合題數：</span>
                <button id="btn-num-3" onclick="setQuestionNum(3)" class="num-btn flex-1 py-2 rounded-full font-bold bg-indigo-600 text-white shadow-md transition-colors text-sm sm:text-base">3 題</button>
                <button id="btn-num-5" onclick="setQuestionNum(5)" class="num-btn flex-1 py-2 rounded-full font-bold bg-transparent text-slate-600 hover:bg-slate-200 transition-colors text-sm sm:text-base">5 題</button>
                <button id="btn-num-10" onclick="setQuestionNum(10)" class="num-btn flex-1 py-2 rounded-full font-bold bg-transparent text-slate-600 hover:bg-slate-200 transition-colors text-sm sm:text-base">10 題</button>
            </div>
            
            <!-- 九宮格課題區塊 -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 max-w-4xl mx-auto mb-10">
                <button onclick="selectTopic('indices')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">指數定律</button>
                <button onclick="selectTopic('factorization')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">因式分解</button>
                <button onclick="selectTopic('rounding')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">近似值與捨入</button>
                <button onclick="selectTopic('identities')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">恆等式</button>
                <button onclick="selectTopic('fractions')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">通分母</button>
                <button onclick="selectTopic('binary')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">二進制</button>
                <button onclick="selectTopic('expansion')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">恆等式的展開</button>
                <button onclick="selectTopic('alg_frac_mul_div')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">代數分式乘除法</button>
                <button onclick="selectTopic('triangle_area')" class="py-5 px-2 border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md hover:bg-indigo-50 transition-all font-bold text-slate-700 shadow-sm text-sm sm:text-base">4B第10章 三角形面積</button>
            </div>

            <!-- 跨課題綜合挑戰四格排版 (含動態配分) -->
            <div class="mt-10 border-t border-slate-100 pt-8 max-w-4xl mx-auto">
                <h3 class="text-xl sm:text-2xl font-bold text-orange-600 mb-2 flex justify-center items-center gap-2">🏆 跨課題綜合挑戰</h3>
                <p class="text-slate-500 text-sm sm:text-base mb-6">系統將從所有課題中隨機挑選題目，模擬真實考試情況。</p>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-4xl mx-auto">
                    <button onclick="startGlobalMixed(1)" class="py-4 px-2 border-2 border-green-200 bg-green-50 rounded-xl hover:border-green-400 hover:shadow-md transition-all flex flex-col items-center justify-center shadow-sm">
                        <span class="text-green-500 font-bold text-lg mb-1">⭐</span>
                        <span class="text-green-700 font-bold">程度 1</span>
                        <span class="text-xs font-bold text-green-600 mt-2 bg-white px-2 py-0.5 rounded-full shadow-sm">🎯 每題 5 分</span>
                    </button>
                    <button onclick="startGlobalMixed(2)" class="py-4 px-2 border-2 border-blue-200 bg-blue-50 rounded-xl hover:border-blue-400 hover:shadow-md transition-all flex flex-col items-center justify-center shadow-sm">
                        <span class="text-blue-500 font-bold text-lg mb-1">⭐⭐</span>
                        <span class="text-blue-700 font-bold">程度 2</span>
                        <span class="text-xs font-bold text-blue-600 mt-2 bg-white px-2 py-0.5 rounded-full shadow-sm">🎯 每題 8 分</span>
                    </button>
                    <button onclick="startGlobalMixed(3)" class="py-4 px-2 border-2 border-purple-200 bg-purple-50 rounded-xl hover:border-purple-400 hover:shadow-md transition-all flex flex-col items-center justify-center shadow-sm">
                        <span class="text-purple-500 font-bold text-lg mb-1">⭐⭐⭐</span>
                        <span class="text-purple-700 font-bold">程度 3</span>
                        <span class="text-xs font-bold text-purple-600 mt-2 bg-white px-2 py-0.5 rounded-full shadow-sm">🎯 每題 12 分</span>
                    </button>
                    <button onclick="startGlobalMixed(4)" class="py-4 px-2 border-2 border-orange-200 bg-orange-50 rounded-xl hover:border-orange-400 hover:shadow-md transition-all flex flex-col items-center justify-center shadow-sm">
                        <span class="text-orange-500 font-bold text-lg mb-1">⭐⭐⭐⭐</span>
                        <span class="text-orange-700 font-bold">程度 4</span>
                        <span class="text-xs font-bold text-orange-600 mt-2 bg-white px-2 py-0.5 rounded-full shadow-sm">🎯 每題 15 分</span>
                    </button>
                </div>
            </div>

            <!-- 雙欄位排行榜 -->
            <div class="mt-14 pt-8 border-t border-slate-100 max-w-4xl mx-auto">
                <h3 class="text-2xl font-bold text-orange-600 mb-2 flex justify-center items-center gap-2">
                    🏆 勤學排行榜 (Top 20)
                </h3>
                <p class="text-slate-500 text-sm mb-6">全校最強刷題王者，累積最高分的勤學生都在這裡！</p>
                
                <div id="my-rank-home"></div>
                <div id="leaderboard-home-container" class="max-h-[500px] overflow-y-auto custom-scrollbar px-1">
                    <div class="text-center py-4 text-slate-500">連線中，請稍候...</div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 畫面 2：選擇難度 (Start Screen) -->
        <!-- ========================================== -->
        <div id="startScreen" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 text-center hidden relative max-w-2xl mx-auto">
            <button onclick="showTopicScreen()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 transition-colors p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            <h2 id="levelTitle" class="text-2xl font-bold text-slate-800 mb-8 mt-2">請選擇難度</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-md mx-auto mb-4">
                <!-- 一般難度 -->
                <button id="btnL1" onclick="startGame(1)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-green-500 hover:bg-green-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐ 程度 1</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL2" onclick="startGame(2)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐ 程度 2</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL3" onclick="startGame(3)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐⭐ 程度 3</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL4" onclick="startGame(4)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-orange-500 hover:bg-orange-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐⭐⭐ 程度 4</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>

                <!-- 細分難度 (用於因式分解) -->
                <button id="btnL2A" onclick="startGame('2a')" class="p-4 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐ 程度 2A</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL2B" onclick="startGame('2b')" class="p-4 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐ 程度 2B</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL3A" onclick="startGame('3a')" class="p-4 border-2 border-slate-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐⭐ 程度 3A</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
                <button id="btnL3B" onclick="startGame('3b')" class="p-4 border-2 border-slate-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-colors hidden flex flex-col items-center">
                    <div class="text-lg font-bold text-slate-700">⭐⭐⭐ 程度 3B</div>
                    <div class="text-sm text-slate-500 mt-1"></div>
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 畫面 3：答題區 (App Container) -->
        <!-- ========================================== -->
        <div id="appContainer" class="hidden max-w-3xl mx-auto">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
                
                <!-- 確認返回彈窗 -->
                <div id="confirmModal" class="hidden absolute inset-0 bg-slate-900/50 z-50 flex items-center justify-center rounded-2xl">
                    <div class="bg-white p-6 rounded-xl shadow-lg max-w-sm w-full mx-4 border border-slate-100">
                        <h3 class="text-xl font-bold text-slate-800 mb-2">確定要離開嗎？</h3>
                        <p class="text-slate-600 mb-6">目前的作答進度將不會被保留，成績也不會上傳。</p>
                        <div class="flex gap-3 justify-end">
                            <button onclick="closeConfirmModal()" class="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">取消</button>
                            <button onclick="confirmBackToLevelSelection()" class="px-4 py-2 bg-red-500 text-white font-bold rounded-lg hover:bg-red-600 transition-colors shadow-sm">確定離開</button>
                        </div>
                    </div>
                </div>

                <!-- 頂部列：返回與跳過本題 -->
                <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                    <button onclick="backToLevelSelectionFromQuiz()" class="text-slate-500 hover:text-indigo-600 transition-colors flex items-center gap-1 group font-bold px-2 py-1 rounded-lg hover:bg-indigo-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                        <span class="text-sm sm:text-base">返回選單</span>
                    </button>
                    <button id="skip-btn" onclick="skipQuestion()" class="text-slate-500 hover:text-orange-600 transition-colors flex items-center gap-1 group font-bold px-2 py-1 rounded-lg hover:bg-orange-50">
                        <span class="text-sm sm:text-base">跳過本題 (0分)</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </button>
                </div>

                <!-- 答題 Header -->
                <div class="flex justify-between items-start mb-6 pb-2">
                    <div class="flex flex-col gap-2">
                        <span id="topicBadge" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold w-max">
                            課題載入中...
                        </span>
                        <span id="levelBadge" class="text-slate-500 font-medium text-sm ml-1">
                            難度: 載入中...
                        </span>
                    </div>
                    
                    <div class="text-right">
                        <div id="progressText" class="text-slate-500 font-bold text-base mb-1">
                            完成 0/3
                        </div>
                        <div class="text-indigo-600 font-bold text-lg bg-indigo-50 px-3 py-1 rounded-lg inline-block shadow-sm border border-indigo-100">
                            分數: <span id="scoreDisplay">0</span>
                        </div>
                    </div>
                </div>

                <div id="questionContainer" class="mb-8 border-t border-slate-100 pt-6">
                    <!-- 題目顯示區 -->
                    <div id="questionText" class="w-full text-center"></div>
                    
                    <!-- 選擇題區塊 -->
                    <div id="optionsGrid" class="grid grid-cols-1 gap-3 sm:gap-4 mt-6"></div>

                    <!-- 雙模輸入區塊 (手寫/鍵盤) -->
                    <div id="handwritingArea" class="hidden mt-6 flex flex-col items-center w-full">
                        
                        <!-- 模式切換標籤 -->
                        <div class="flex w-full max-w-[500px] mb-3 bg-slate-200 p-1 rounded-lg">
                            <button id="tab-draw" onclick="switchInputMode('draw')" class="flex-1 py-2 text-sm font-bold rounded-md bg-white text-indigo-600 shadow-sm transition-all">✍️ 手寫輸入</button>
                            <button id="tab-keyboard" onclick="switchInputMode('keyboard')" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">⌨️ 鍵盤輸入</button>
                        </div>

                        <!-- 容器區塊 -->
                        <div id="input-container" class="w-full max-w-[500px] relative">
                            
                            <!-- ✍️ 手寫區 -->
                            <div id="draw-input-zone" class="w-full flex flex-col items-center">
                                <div id="draw-container" class="w-full border-4 border-slate-300 rounded-xl overflow-hidden shadow-inner relative h-64 sm:h-72 touch-none bg-white transition-colors">
                                    <canvas id="draw-canvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                                </div>
                                <div class="flex gap-4 mt-4 w-full">
                                    <button id="clear-btn" class="flex-1 py-3 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition-colors shadow-sm">清除重畫</button>
                                    <button id="recognize-btn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors shadow-md flex justify-center items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                        辨識並提交
                                    </button>
                                </div>
                            </div>

                            <!-- ⌨️ 鍵盤區 -->
                            <div id="keyboard-input-zone" class="w-full flex flex-col items-center hidden">
                                <div id="kb-container" class="w-full border-4 border-slate-300 rounded-xl overflow-hidden shadow-inner relative p-4 bg-slate-50 h-64 sm:h-72 flex flex-col transition-colors">
                                    <label class="block text-sm font-bold text-slate-600 mb-2">請使用鍵盤輸入數式：</label>
                                    <textarea id="keyboard-math-input" placeholder="例如：(x-2)(x+3) 或 3x^2/2y" class="w-full flex-1 p-3 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-lg font-mono resize-none shadow-inner bg-white"></textarea>
                                </div>
                                <div class="flex gap-4 mt-4 w-full">
                                    <button id="kb-clear-btn" class="flex-1 py-3 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition-colors shadow-sm">清空文字</button>
                                    <button id="kb-recognize-btn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors shadow-md flex justify-center items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                        轉換並提交
                                    </button>
                                </div>
                            </div>

                            <!-- 全局 Loading 遮罩 -->
                            <div id="global-loading" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center rounded-xl border border-slate-200 shadow-sm">
                                <svg class="animate-spin h-10 w-10 text-indigo-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <p id="global-loading-text" class="text-indigo-700 font-bold text-center px-4 leading-relaxed">載入中...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="feedbackArea" class="hidden">
                    <div id="feedbackBox" class="p-4 rounded-xl border w-full overflow-hidden shadow-sm">
                        <div id="feedbackMessage" class="flex flex-col w-full text-center"></div>
                    </div>
                    <button id="nextBtn" class="mt-6 w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all transform hover:scale-[1.02] shadow-md text-lg">
                        下一題 ➡️
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 畫面 4：結算畫面 (End Screen) -->
        <!-- ========================================== -->
        <div id="endScreen" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center hidden max-w-2xl mx-auto">
            <h2 class="text-3xl font-bold text-slate-800 mb-6">🎉 恭喜完成訓練！</h2>
            
            <div class="inline-block p-6 rounded-2xl bg-indigo-50 border-2 border-indigo-100 mb-8 w-full max-w-sm shadow-inner">
                <div class="text-slate-500 font-medium mb-2">本次得分</div>
                <div class="text-6xl font-black text-indigo-600 drop-shadow-sm"><span id="finalScore">0</span><span class="text-2xl text-indigo-400 ml-1">/ <span id="totalQuestions">30</span></span></div>
            </div>
            
            <div class="mb-8 max-w-md mx-auto p-5 bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl border border-amber-100 shadow-sm">
                <div class="text-amber-500 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                </div>
                <div id="motivationalQuote" class="text-lg font-bold text-slate-700 leading-relaxed tracking-wide">
                    讀取中...
                </div>
            </div>

            <!-- 成績傳送區塊 -->
            <div class="mt-8 pt-8 border-t border-slate-100 max-w-md mx-auto text-left">
                <h3 class="text-xl font-bold text-slate-800 mb-4 text-center flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                    記錄成績以解鎖獎勵
                </h3>
                
                <div id="rewardContainer" class="hidden mb-6"></div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div class="col-span-1">
                        <label class="block text-sm font-bold text-slate-600 mb-1 pl-1">班別 (Class)</label>
                        <select id="className" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 bg-slate-50 focus:bg-white transition-colors">
                            <option value="">請選擇</option>
                            <option value="4A">4A</option><option value="4B">4B</option><option value="4C">4C</option><option value="4D">4D</option>
                        </select>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-sm font-bold text-slate-600 mb-1 pl-1">學號 (No.)</label>
                        <input type="number" id="classNumber" min="1" max="40" placeholder="如: 12" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 bg-slate-50 focus:bg-white transition-colors text-center">
                    </div>
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-600 mb-1 pl-1">姓名 (Name)</label>
                    <input type="text" id="studentName" placeholder="請輸入全名" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 bg-slate-50 focus:bg-white transition-colors">
                </div>
                
                <button id="submitRecordBtn" onclick="submitToGoogleSheet()" class="w-full py-4 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition-all shadow-md flex justify-center items-center gap-2 text-lg">
                    傳送成績
                </button>
                <div id="submitStatus" class="mt-3 text-center text-sm font-bold hidden"></div>
            </div>

            <!-- 結算畫面的縮圖排行榜 -->
            <div class="mt-8 bg-white border-2 border-indigo-50 rounded-xl overflow-hidden shadow-sm max-w-md mx-auto">
                <div class="bg-indigo-50 py-3 text-center border-b border-indigo-100">
                    <span class="font-bold text-indigo-800 flex items-center justify-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd" /></svg>
                        最新即時排名
                    </span>
                </div>
                <div class="p-3">
                    <div id="my-rank-end"></div>
                    <div id="leaderboard-end-container" class="max-h-64 overflow-y-auto custom-scrollbar text-sm px-1">
                        <!-- 動態插入 -->
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-100">
                <button onclick="showTopicScreen()" class="text-slate-500 hover:text-slate-700 font-bold transition-colors">
                    返回課題選單
                </button>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- 🌟 強制破除快取 (v=100) 加上 defer 確保載入順序 -->

    <script src="js/topics/indices.js?v=100" defer></script>
    <script src="js/topics/factorization.js?v=100" defer></script>
    <script src="js/topics/rounding.js?v=100" defer></script>
    <script src="js/topics/identities.js?v=100" defer></script>
    <script src="js/topics/fractions.js?v=100" defer></script>
    <script src="js/topics/binary.js?v=100" defer></script>
    <script src="js/topics/expansion.js?v=100" defer></script>
    <script src="js/topics/algebraic_fractions_mul_div.js?v=100" defer></script>
    <script src="js/topics/triangle_area.js?v=100" defer></script>
    <script src="js/app.js?v=100" defer></script>

</body>
</html>
